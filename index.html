<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 주사위 시뮬레이터</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #stage {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            cursor: pointer;
        }

        .dice-scene {
            width: 160px;
            height: 160px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .dice-face {
            position: absolute;
            width: 160px;
            height: 160px;
            background: #ffffff;
            border: 4px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 18px;
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        .dot {
            width: 24px;
            height: 24px;
            background-color: #1e293b;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
        }

        .dot.red {
            background-color: #ef4444;
            width: 32px;
            height: 32px;
        }

        /* 3D Cube Placement */
        .face-1 { transform: rotateY(0deg) translateZ(80px); }
        .face-6 { transform: rotateY(180deg) translateZ(80px); }
        .face-2 { transform: rotateY(-90deg) translateZ(80px); }
        .face-5 { transform: rotateY(90deg) translateZ(80px); }
        .face-3 { transform: rotateX(90deg) translateZ(80px); }
        .face-4 { transform: rotateX(-90deg) translateZ(80px); }

        /* UI Overlay */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 24px;
        }

        .interactive { pointer-events: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
        }

        .title-badge {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .roll-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 48px;
            border-radius: 100px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            transition: all 0.2s ease;
        }

        .roll-btn:active { transform: scale(0.95); }

        .guide-text {
            font-size: 0.9rem;
            color: var(--text-sub);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="stage">
        <div class="dice-scene" id="dice">
            <!-- 1번 면 (빨간 점) -->
            <div class="dice-face face-1">
                <div></div><div></div><div></div>
                <div></div><div class="dot red"></div><div></div>
                <div></div><div></div><div></div>
            </div>
            <!-- 6번 면 -->
            <div class="dice-face face-6">
                <div class="dot"></div><div></div><div class="dot"></div>
                <div class="dot"></div><div></div><div class="dot"></div>
                <div class="dot"></div><div></div><div class="dot"></div>
            </div>
            <!-- 2번 면 -->
            <div class="dice-face face-2">
                <div class="dot"></div><div></div><div></div>
                <div></div><div></div><div></div>
                <div></div><div></div><div class="dot"></div>
            </div>
            <!-- 5번 면 -->
            <div class="dice-face face-5">
                <div class="dot"></div><div></div><div class="dot"></div>
                <div></div><div class="dot"></div><div></div>
                <div class="dot"></div><div></div><div class="dot"></div>
            </div>
            <!-- 3번 면 -->
            <div class="dice-face face-3">
                <div class="dot"></div><div></div><div></div>
                <div></div><div class="dot"></div><div></div>
                <div></div><div></div><div class="dot"></div>
            </div>
            <!-- 4번 면 -->
            <div class="dice-face face-4">
                <div class="dot"></div><div></div><div class="dot"></div>
                <div></div><div></div><div></div>
                <div class="dot"></div><div></div><div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="glass-card title-badge">
                <span>🎲 3D 주사위</span>
            </div>
        </header>

        <footer class="interactive">
            <button class="roll-btn" id="roll-btn">주사위 굴리기!</button>
            <div class="guide-text">
                <span>화면 아무 데나 터치하거나 태블릿을 흔드세요</span>
            </div>
        </footer>
    </div>

    <script>
        const dice = document.getElementById('dice');
        const stage = document.getElementById('stage');
        const rollBtn = document.getElementById('roll-btn');

        let isRolling = false;
        let currentX = -25;
        let currentY = 45;

        // 면별 3D 회전 각도값
        const faceRotations = {
            1: { x: 0, y: 0 },
            6: { x: 0, y: 180 },
            2: { x: 0, y: 90 },
            5: { x: 0, y: -90 },
            3: { x: -90, y: 0 },
            4: { x: 90, y: 0 }
        };

        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            const targetVal = Math.floor(Math.random() * 6) + 1;
            const targetRot = faceRotations[targetVal];

            // 바퀴 수 추가 (3~5바퀴 돌고 멈추기)
            const extraX = (Math.floor(Math.random() * 3) + 3) * 360;
            const extraY = (Math.floor(Math.random() * 3) + 3) * 360;

            currentX += extraX + targetRot.x;
            currentY += extraY + targetRot.y;

            dice.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            setTimeout(() => {
                isRolling = false;
            }, 1200);
        }

        rollBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            rollDice();
        });

        stage.addEventListener('click', rollDice);

        // 기본 기울기 설정
        dice.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

        // 태블릿 흔들기 감지
        let lastX = null, lastY = null, lastZ = null;
        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (lastX !== null) {
                const delta = Math.abs(acc.x - lastX) + Math.abs(acc.y - lastY) + Math.abs(acc.z - lastZ);
                if (delta > 18) rollDice();
            }
            lastX = acc.x; lastY = acc.y; lastZ = acc.z;
        });
    </script>
</body>
</html>
