<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 주사위 시뮬레이터</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: pointer;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 24px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
        }

        .title-badge {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .title-badge i {
            color: #818cf8;
        }

        .controls-top {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn.active {
            color: #818cf8;
            border-color: rgba(129, 140, 248, 0.4);
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .roll-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 48px;
            border-radius: 100px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .roll-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }

        .guide-text {
            font-size: 0.9rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* Modal Guide */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 480px;
            padding: 32px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .guide-step {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .step-icon {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .step-text h4 { font-size: 1rem; margin-bottom: 4px; }
        .step-text p { font-size: 0.88rem; color: var(--text-sub); line-height: 1.4; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="glass-card title-badge">
                <i class="fa-solid fa-dice-d6"></i>
                <span>3D 주사위</span>
            </div>
            <div class="controls-top">
                <button class="glass-card icon-btn active" id="sound-btn" title="소리 켜기/끄기">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button class="glass-card icon-btn" id="info-btn" title="태블릿 사용 안내">
                    <i class="fa-solid fa-circle-info"></i>
                </button>
            </div>
        </header>

        <footer class="interactive">
            <button class="roll-btn" id="roll-btn">
                <i class="fa-solid fa-rotate"></i>
                <span>주사위 굴리기!</span>
            </button>
            <div class="guide-text">
                <i class="fa-solid fa-hand-pointer"></i>
                <span>화면 아무 데나 터치하거나 태블릿을 흔드세요</span>
            </div>
        </footer>
    </div>

    <!-- 태블릿 사용 안내 모달 -->
    <div class="modal" id="guide-modal">
        <div class="glass-card modal-content interactive">
            <div class="modal-header">
                <h3>📱 태블릿 활용 안내</h3>
                <button class="close-btn" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="guide-step">
                <div class="step-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="step-text">
                    <h4>홈 화면에 앱으로 추가하기</h4>
                    <p>브라우저 메뉴에서 <b>'홈 화면에 추가'</b>를 누르면 풀스크린 주사위 앱처럼 사용 가능합니다.</p>
                </div>
            </div>
            <div class="guide-step">
                <div class="step-icon"><i class="fa-solid fa-hand-transform"></i></div>
                <div class="step-text">
                    <h4>터치 & 흔들기</h4>
                    <p>버튼 외에도 <b>3D 화면 전체</b>를 터치하거나 태블릿을 살짝 흔들면 주사위가 굴러갑니다.</p>
                </div>
            </div>
            <div class="guide-step">
                <div class="step-icon"><i class="fa-solid fa-volume-off"></i></div>
                <div class="step-text">
                    <h4>소리가 안 들릴 때</h4>
                    <p>태블릿 측면의 <b>무음/진동 모드</b>를 해제하고 볼륨을 올려주세요.</p>
                </div>
            </div>
        </div>
